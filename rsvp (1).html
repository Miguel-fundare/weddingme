:root{
  --ivory:#FCFAF6; --white:#FFFFFF;
  --ink:#2E2B27; --ink-2:#57524B; --mute:#8E877D;
  --gold:#B4985E; --hair:rgba(180,152,94,.38); --hair-soft:rgba(180,152,94,.18);
  --err:#A65A46;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Helvetica,Arial,sans-serif;
  --script:'Imperial Script','Cormorant Garamond',cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:500 1.15rem/1.55 var(--serif);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh}
[hidden]{display:none!important}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.app{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(70% 40% at 50% 0%,rgba(180,152,94,.13),transparent 70%),var(--ivory);transition:background-color .4s}
.top{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.35rem .7rem}
.mono{font:500 1.35rem/1 var(--serif);letter-spacing:.02em;color:var(--ink);text-decoration:none}
.mono i{font-style:italic;color:var(--gold);margin:0 .12em}
.langs{display:flex;gap:.15rem}
.langs button{font:400 .78rem/1 var(--sans);letter-spacing:.08em;background:none;border:0;padding:.5rem .5rem;color:var(--mute);cursor:pointer;border-bottom:1px solid transparent}
.langs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--gold)}
.bar{height:2px;background:var(--hair-soft);margin:0 1.35rem}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .45s ease}

main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:6vh 1.35rem 2.5rem}
@media (min-width:700px) and (min-height:760px){main{align-items:center;padding-top:1.5rem}}
.step{width:100%;max-width:540px;animation:in .4s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.bar i{transition:none}}

.back{display:inline-flex;align-items:center;gap:.35rem;font:400 .82rem/1 var(--sans);letter-spacing:.06em;color:var(--mute);background:none;border:0;padding:.4rem 0;margin:0 0 1.6rem;cursor:pointer}
.back svg{width:.7rem;height:.7rem}
.back:hover{color:var(--ink)}

.eyebrow{font:500 1.1rem/1.3 var(--serif);font-style:italic;color:var(--gold);margin:0 0 .8rem;text-align:center}
h1{font:400 clamp(2.5rem,9vw,3.6rem)/1.05 var(--serif);letter-spacing:-.01em;margin:0 0 .9rem;text-align:center}
h1.xl{font-size:clamp(3.2rem,13vw,5rem)}
.text{font-size:clamp(1.15rem,3.6vw,1.3rem);color:var(--ink-2);text-align:center;margin:0 0 1.9rem;line-height:1.5}
.text.tight{margin-bottom:1rem}
.quiet{font:400 .9rem/1.5 var(--sans);color:var(--mute);text-align:center;margin:1.2rem 0 0}
.quiet a{color:var(--ink-2)}
.pan{font-size:clamp(1.35rem,4.6vw,1.7rem);font-style:italic;text-align:center;margin:1.6rem 0 1.4rem;line-height:1.35}
.orn{display:block;width:120px;height:24px;margin:0 auto 1.4rem;stroke:var(--gold);fill:none;stroke-width:1}
.names{font:400 clamp(2.6rem,9vw,3.6rem)/1.1 var(--script);color:var(--gold);text-align:center;margin:0 0 .4rem}

.field{margin:0 0 1.5rem}
.field label,.lbl{display:block;font:400 .84rem/1.35 var(--sans);letter-spacing:.03em;color:var(--ink-2);margin-bottom:.45rem}
.opt{color:var(--mute)}
.field input,.field textarea{display:block;width:100%;border:0;border-bottom:1px solid var(--hair);border-radius:0;background:transparent;padding:.6rem 0;min-height:2.7rem;font:400 1.12rem/1.4 var(--sans);color:var(--ink);-webkit-appearance:none;appearance:none}
.field input::placeholder,.field textarea::placeholder{color:#B9B3A9}
.field input:focus,.field textarea:focus{outline:0;border-bottom:1px solid var(--ink)}
.field input[type=date]{min-width:0;color:var(--ink)}
.field input[type=date]::-webkit-date-and-time-value{text-align:left}
.field textarea{resize:vertical;min-height:4rem}
.field.center input{text-align:center;font-size:1.3rem}
.hint{font:400 .82rem/1.45 var(--sans);color:var(--mute);margin:.5rem 0 0}
.err{display:none;font:400 .82rem/1.3 var(--sans);color:var(--err);margin:.5rem 0 0}
.invalid .err{display:block}
.invalid label,.invalid .lbl{color:var(--err)}
.invalid input,.invalid textarea{border-bottom-color:var(--err)}
.invalid .choice{border-color:rgba(166,90,70,.6)}

.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:.6rem;min-height:3.4rem;padding:.9rem 1.5rem;font:400 .95rem/1.2 var(--sans);letter-spacing:.07em;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:#fff;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s;-webkit-appearance:none;appearance:none}
.btn:hover{background:#111}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--gold)}
.btn.ghost:hover{background:rgba(180,152,94,.1)}
.btn.xl{min-height:4rem;font-size:1.05rem}
.btn[disabled]{opacity:.55;cursor:default}
.stack{display:flex;flex-direction:column;gap:.7rem;margin-top:.4rem}
.link{display:block;width:100%;text-align:center;font:400 .85rem/1.4 var(--sans);letter-spacing:.04em;color:var(--mute);background:none;border:0;padding:.9rem 0 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair)}
.link:hover{color:var(--ink)}

.choices{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.choice{border:1px solid var(--hair);background:#fff;padding:.7rem 1.05rem;font:400 .95rem/1.2 var(--sans);color:var(--ink);cursor:pointer;border-radius:2px;transition:background .15s,color .15s,border-color .15s;-webkit-appearance:none;appearance:none;min-height:2.9rem}
.choice[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.choice.num{min-width:3.1rem;padding:.7rem .5rem;text-align:center}
.opts{display:flex;flex-direction:column;gap:.6rem}
.opt-btn{display:block;width:100%;text-align:left;border:1px solid var(--hair);background:#fff;padding:1rem 1.15rem;border-radius:2px;cursor:pointer;-webkit-appearance:none;appearance:none;transition:background .15s,color .15s,border-color .15s}
.opt-btn b{display:block;font:400 1rem/1.3 var(--sans);color:var(--ink)}
.opt-btn small{display:block;font:400 .8rem/1.3 var(--sans);color:var(--mute);margin-top:.15rem}
.opt-btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}
.opt-btn[aria-pressed=true] b,.opt-btn[aria-pressed=true] small{color:#fff}
.opt-btn[aria-pressed=true] small{color:rgba(255,255,255,.72)}
.sub{margin-top:1.2rem}
.hotel-box{border:1px solid var(--hair-soft);padding:1rem 1rem 1.1rem;margin:1.4rem 0 1rem;text-align:center}
.hotel-box .lbl{text-align:center;margin-bottom:.7rem}

.gal{display:flex;gap:.6rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:1.4rem -1.35rem 1.2rem;padding:0 1.35rem;align-items:center;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 auto;scroll-snap-align:center;object-fit:cover;border-radius:2px;background:#fff;border:1px solid var(--hair-soft)}
.gal img.w{width:min(92%,520px);aspect-ratio:3/2}
.gal img.p{width:min(66%,300px);aspect-ratio:4/5}
.dress-lines{font-size:1.05rem;color:var(--ink-2);text-align:center;margin:0 0 1.5rem;line-height:1.5}
.dress-lines b{font-weight:500;color:var(--ink)}

.demo{font:400 .82rem/1.45 var(--sans);color:#8A6D2B;background:#FBF3DF;border:1px solid #EAD9A8;padding:.7rem .9rem;margin:1.25rem 0 0;text-align:center}
.form-err{font:400 .85rem/1.4 var(--sans);color:var(--err);text-align:center;margin:.9rem 0 0}

footer{text-align:center;padding:0 1.35rem 1.4rem;font:500 1rem/1 var(--serif);font-style:italic;color:var(--mute)}

/* emo mode */
body.emo{background:#0E0E0E}
.app.emo{background:#0E0E0E;color:#fff}
.app.emo .mono,.app.emo .mono i,.app.emo .langs button[aria-pressed=true]{color:#fff}
.app.emo .langs button{border-bottom-color:transparent}
.app.emo .langs button[aria-pressed=true]{border-bottom-color:#fff}
.app.emo .bar{background:rgba(255,255,255,.14)}.app.emo .bar i{background:#fff}
.app.emo h1{color:#fff}.app.emo .text{color:#C9C9C9}.app.emo footer,.app.emo .link{color:#8A8A8A}
.emo-face{display:block;width:140px;height:140px;margin:0 auto 1rem;color:#fff}
.btn.inv{background:#fff;color:#0E0E0E;border-color:#fff}.btn.inv:hover{background:#E6E6E6}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-orn" viewBox="0 0 120 24"><line x1="0" y1="17.5" x2="120" y2="17.5"/><circle cx="60" cy="11" r="6.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 12 12"><path d="M8 1.5L3.5 6 8 10.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <a class="mono" href="#" onclick="location.reload();return false" aria-label="Miguel & Ekaterina">M<i>&amp;</i>E</a>
    <div class="langs" role="group" aria-label="Idioma">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>

  <main id="main">

    <!-- s0: name -->
    <section class="step" data-step="s0" hidden>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 class="xl" data-t="s0.title"></h1>
      <p class="text" id="s0text" data-t="s0.text"></p>
      <div class="field center" data-f="name">
        <input id="iName" type="text" autocomplete="name" data-ph="s0.ph" aria-labelledby="s0text">
        <p class="err" data-t="required"></p>
      </div>
      <button type="button" class="btn xl" data-go="s1" data-t="s0.btn"></button>
    </section>

    <!-- s1: yes / no -->
    <section class="step" data-step="s1" hidden>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 class="xl" data-t="s1.title" data-name></h1>
      <p class="text" data-t="s1.text"></p>
      <div class="stack">
        <button type="button" class="btn xl" id="btnYes" data-t="s1.yes"></button>
        <button type="button" class="btn xl ghost" id="btnNo" data-t="s1.no"></button>
      </div>
      <p class="form-err" id="errS1" hidden data-t="error"></p>
      <button type="button" class="link" data-go="s0" data-t="s1.notyou" data-name></button>
    </section>

    <!-- s2: how many -->
    <section class="step" data-step="s2" hidden>
      <button type="button" class="back" data-back><svg><use href="#i-back"/></svg><span data-t="back"></span></button>
      <h1 data-t="s2.title"></h1>
      <p class="text" data-t="s2.text"></p>
      <div class="field" data-f="guests">
        <div class="choices" role="group">
          <button type="button" class="choice num" data-choice="guests" data-value="1" aria-pressed="true">1</button>
          <button type="button" class="choice num" data-choice="guests" data-value="2" aria-pressed="false">2</button>
          <button type="button" class="choice num" data-choice="guests" data-value="3" aria-pressed="false">3</button>
          <button type="button" class="choice num" data-choice="guests" data-value="4" aria-pressed="false">4</button>
          <button type="button" class="choice num" data-choice="guests" data-value="5+" aria-pressed="false">5+</button>
        </div>
      </div>
      <div class="field" id="fWho" hidden>
        <label for="iWho" data-t="s2.who"></label>
        <input id="iWho" type="text" data-ph="s2.whoPh">
      </div>
      <button type="button" class="btn" data-go="s3" data-t="next"></button>
    </section>

    <!-- s3: dates -->
    <section class="step" data-step="s3" hidden>
      <button type="button" class="back" data-back><svg><use href="#i-back"/></svg><span data-t="back"></span></button>
      <h1 data-t="s3.title"></h1>
      <p class="text" data-t="s3.text"></p>
      <div class="field" data-f="arrival">
        <label for="iArr" data-t="s3.arr"></label>
        <input id="iArr" type="date" min="2026-10-01" max="2026-12-31">
        <p class="err" data-t="required"></p>
      </div>
      <div class="field">
        <label for="iDep"><span data-t="s3.dep"></span> <span class="opt" data-t="optional"></span></label>
        <input id="iDep" type="date" min="2026-10-01" max="2026-12-31">
      </div>
      <button type="button" class="btn" data-go="s4" data-t="next"></button>
    </section>

    <!-- s4: lodging -->
    <section class="step" data-step="s4" hidden>
      <button type="button" class="back" data-back><svg><use href="#i-back"/></svg><span data-t="back"></span></button>
      <h1 data-t="s4.title"></h1>
      <div class="field" data-f="lodging">
        <div class="opts" role="group">
          <button type="button" class="opt-btn" data-choice="lodging" data-value="hotel" aria-pressed="false"><b data-t="s4.hotel"></b><small data-t="s4.hotelSub"></small></button>
          <button type="button" class="opt-btn" data-choice="lodging" data-value="other" aria-pressed="false"><b data-t="s4.other"></b></button>
          <button type="button" class="opt-btn" data-choice="lodging" data-value="undecided" aria-pressed="false"><b data-t="s4.undecided"></b><small data-t="s4.undecidedSub"></small></button>
        </div>
        <p class="err" data-t="choose"></p>
      </div>
      <p class="quiet" id="undecidedNote" data-t="s4.undecidedNote" hidden></p>
      <div class="hotel-box">
        <p class="lbl" data-t="s4.hotelLine"></p>
        <a class="btn ghost" href="https://share-na2.hsforms.com/1MEsFXKg_RtqrYpHZwbNxlA40exb2" target="_blank" rel="noopener" data-track="hotel_click" data-t="s4.bookBtn"></a>
      </div>
      <button type="button" class="btn" data-go="s6" data-t="next"></button>
    </section>

    <!-- s5: dress code -->
    <section class="step" data-step="s5" hidden>
      <button type="button" class="back" data-back><svg><use href="#i-back"/></svg><span data-t="back"></span></button>
      <p class="eyebrow" data-t="s5.eyebrow"></p>
      <h1 class="xl" data-t="s5.title"></h1>
      <p class="text tight" data-t="s5.text"></p>
      <div class="gal" aria-label="Dress code">
        <img class="w" data-img="1" alt="">
        <img class="w" data-img="2" alt="">
        <img class="p" data-img="3" alt="">
        <img class="p" data-img="4" alt="">
        <img class="p" data-img="5" alt="">
      </div>
      <p class="dress-lines"><span data-t="s5.her"></span><br><span data-t="s5.him"></span></p>
      <button type="button" class="btn xl" id="btnDress" data-go="s2" data-t="s5.btn"></button>
      <button type="button" class="link" id="btnEmo" data-t="s5.emo"></button>
    </section>

    <!-- emo: dress-code joke -->
    <section class="step" data-step="emo" hidden>
      <svg class="emo-face" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="66" r="38" fill="none" stroke="currentColor" stroke-width="2"/><path d="M23 62 C 22 32, 56 18, 92 30 C 102 40, 100 60, 92 80 C 86 70, 78 62, 68 66 C 62 60, 52 60, 42 64 C 36 60, 28 60, 23 62 Z" fill="currentColor"/><circle cx="44" cy="74" r="3.5" fill="currentColor"/><path d="M44 81 c 0 4 -3 6 -3 9 a 3 3 0 0 0 6 0 c 0 -3 -3 -5 -3 -9 z" fill="currentColor"/><path d="M48 98 h 22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <h1 data-t="emo.title"></h1>
      <p class="text" id="emoText" data-t="emo.text"></p>
      <button type="button" class="btn xl inv" id="btnEmoOk" data-t="emo.btn"></button>
      <button type="button" class="link" id="btnEmoMore" data-t="emo.more"></button>
    </section>

    <!-- s6: contact + send -->
    <section class="step" data-step="s6" hidden>
      <button type="button" class="back" data-back><svg><use href="#i-back"/></svg><span data-t="back"></span></button>
      <h1 data-t="s6.title"></h1>
      <p class="text" data-t="s6.text"></p>
      <div class="field" data-f="contact">
        <label for="iContact" data-t="s6.contact"></label>
        <input id="iContact" type="text" autocomplete="email" inputmode="email">
        <p class="err" data-t="required"></p>
      </div>
      <div class="field">
        <label for="iDiet"><span data-t="s6.diet"></span> <span class="opt" data-t="optional"></span></label>
        <input id="iDiet" type="text">
      </div>
      <div class="field">
        <label for="iMsg"><span data-t="s6.msg"></span> <span class="opt" data-t="optional"></span></label>
        <textarea id="iMsg" rows="2"></textarea>
      </div>
      <button type="button" class="btn xl" id="btnSend" data-t="s6.btn"></button>
      <p class="form-err" id="errS6" hidden data-t="error"></p>
    </section>

    <!-- s7: done (yes) + gift -->
    <section class="step" data-step="s7" hidden>
      <svg class="orn" aria-hidden="true"><use href="#i-orn"/></svg>
      <h1 data-t="s7.title" data-name></h1>
      <p class="text" data-t="s7.text"></p>
      <p class="pan" data-t="s7.gift"></p>
      <div class="stack">
        <a class="btn" href="https://www.zola.com/registry/miguelandekaterina" target="_blank" rel="noopener" data-track="zola_click" data-t="s7.zola"></a>
        <button type="button" class="btn ghost" data-go="s8" data-track="presence_click" data-t="s7.presence"></button>
      </div>
      <p class="demo" data-demo hidden data-t="demo"></p>
    </section>

    <!-- s8: final -->
    <section class="step" data-step="s8" hidden>
      <svg class="orn" aria-hidden="true"><use href="#i-orn"/></svg>
      <h1 data-t="s8.title"></h1>
      <p class="text" data-t="s8.text"></p>
      <p class="names">Miguel &amp; Ekaterina</p>
      <button type="button" class="link" data-change data-t="change"></button>
    </section>

    <!-- sno: not coming -->
    <section class="step" data-step="sno" hidden>
      <h1 data-t="sno.title" data-name></h1>
      <p class="text tight" data-t="sno.text"></p>
      <p class="pan" data-t="sno.pan"></p>
      <div class="stack">
        <a class="btn xl" href="https://www.zola.com/registry/miguelandekaterina" target="_blank" rel="noopener" data-track="pan_click" data-t="sno.buy"></a>
      </div>
      <button type="button" class="link" id="btnChangeToYes" data-t="sno.change"></button>
      <p class="demo" data-demo hidden data-t="demo"></p>
    </section>

    <!-- again: already answered -->
    <section class="step" data-step="again" hidden>
      <svg class="orn" aria-hidden="true"><use href="#i-orn"/></svg>
      <h1 data-t="again.title" data-name></h1>
      <p class="text" id="againText"></p>
      <button type="button" class="btn" data-change data-t="change"></button>
    </section>

  </main>
  <footer data-t="footer"></footer>
</div>

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
let lang='es';
const t=k=>(T[lang][k]??T.es[k]??'');
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
function track(ev,p){try{gtag('event',ev,p||{})}catch(e){}}
const configured=/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(RSVP_ENDPOINT);

/* ---------- answers ---------- */
const A={name:'',attending:'',guests:'1',companions:'',arrival:'',departure:'',lodging:'',dresscode_ok:'',contact:'',dietary:'',message:'',note:''};
const first=()=>A.name.trim().replace(/^(don|doña|dona|dear|dr\.?|dra\.?|arq\.?|arquitecta|arquitecto|ing\.?|lic\.?|sr\.?|sra\.?|дорогая|дорогой|дорогие)\s+/i,'').split(/\s+/)[0]||'';

/* ---------- i18n ---------- */
function fill(s){return s.replace('{name}',first())}
function applyLang(l){
  lang=T[l]?l:'es'; document.documentElement.lang=lang;
  $$('[data-t]').forEach(el=>{el.textContent=fill(t(el.dataset.t))});
  $$('[data-ph]').forEach(el=>{el.placeholder=t(el.dataset.ph)});
  $$('.langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  const at=$('#againText'); if(at) at.textContent=t(read('rsvp_attending')==='yes'?'again.yes':'again.no');
  store('lang',lang);
}
$$('.langs button').forEach(b=>b.addEventListener('click',()=>{applyLang(b.dataset.lang);track('lang_change',{lang})}));

/* ---------- navigation ---------- */
const order=['s5','s2','s3','s4','s6'];
let hist=[];
function show(id,push=true){
  const cur=$('.step:not([hidden])');
  if(cur&&push&&cur.dataset.step!==id) hist.push(cur.dataset.step);
  $$('.step').forEach(s=>{s.hidden=s.dataset.step!==id});
  document.body.classList.toggle('emo',id==='emo'); $('.app').classList.toggle('emo',id==='emo');
  const el=$(`.step[data-step="${id}"]`); el.style.animation='none'; void el.offsetWidth; el.style.animation='';
  $$('[data-name]',el).forEach(n=>{n.textContent=fill(t(n.dataset.t))});
  const i=order.indexOf(id); $('#bar').style.width=(id==='s7'||id==='s8')?'100%':(i<0?'0%':((i+1)/(order.length+1)*100)+'%');
  window.scrollTo(0,0);
  if(matchMedia('(hover:hover)').matches){const f=el.querySelector('input,textarea');if(f)setTimeout(()=>f.focus({preventScroll:true}),80)}
}
function back(){const p=hist.pop(); if(p) show(p,false);}
$$('[data-back]').forEach(b=>b.addEventListener('click',back));

/* ---------- validation ---------- */
function mark(f,bad){const el=$(`.field[data-f="${f}"]`); el.classList.toggle('invalid',bad); return bad}
function ok(step){
  let bad=false;
  if(step==='s0'){A.name=$('#iName').value.trim(); bad=mark('name',!A.name)}
  if(step==='s2'){A.companions=$('#iWho').value.trim()}
  if(step==='s3'){A.arrival=$('#iArr').value; A.departure=$('#iDep').value; bad=mark('arrival',!A.arrival)}
  if(step==='s4'){bad=mark('lodging',!A.lodging)}
  if(step==='s6'){A.contact=$('#iContact').value.trim(); A.dietary=$('#iDiet').value.trim(); A.message=$('#iMsg').value.trim(); bad=mark('contact',!A.contact)}
  if(bad){const f=$('.field.invalid input');if(f)f.focus({preventScroll:true})}
  store('rsvp_draft',JSON.stringify(A));
  return !bad;
}
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>{
  const from=b.closest('.step').dataset.step;
  if(!ok(from)) return;
  if(b.id==='btnDress'){A.dresscode_ok='yes';track('dress_ok')}
  show(b.dataset.go);
}));
$$('input,textarea').forEach(i=>i.addEventListener('input',()=>{const f=i.closest('.field');if(f)f.classList.remove('invalid')}));
$('#iName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('.step[data-step="s0"] [data-go]').click()}});

/* choices */
$$('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>{
  const g=btn.dataset.choice, v=btn.dataset.value; A[g]=v;
  $$(`[data-choice="${g}"]`).forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
  const f=btn.closest('.field'); if(f) f.classList.remove('invalid');
  if(g==='guests') $('#fWho').hidden=v==='1';
  if(g==='lodging'){$('#undecidedNote').hidden=v!=='undecided'}
}));

/* ---------- send ---------- */
async function send(){
  const data={...A,timestamp:new Date().toISOString(),lang,user_agent:navigator.userAgent};
  if(configured){
    await fetch(RSVP_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
  }else{
    await new Promise(r=>setTimeout(r,600));
  }
  store('rsvp_done','1'); store('rsvp_attending',A.attending); store('rsvp_name',A.name);
  $$('[data-demo]').forEach(d=>d.hidden=configured);
  track('rsvp_submit',{attending:A.attending,guests:A.guests,lodging:A.lodging,lang});
}

$('#btnYes').addEventListener('click',()=>{A.attending='yes';track('rsvp_yes');show('s5')});
$('#btnNo').addEventListener('click',async()=>{
  const b=$('#btnNo'); b.disabled=true; $('#errS1').hidden=true;
  A.attending='no'; track('rsvp_no');
  try{await send(); show('sno')}catch(e){$('#errS1').hidden=false}
  b.disabled=false;
});
$('#btnSend').addEventListener('click',async()=>{
  if(!ok('s6')) return;
  const b=$('#btnSend'); b.disabled=true; b.textContent=t('sending'); $('#errS6').hidden=true;
  try{await send(); show('s7')}catch(e){$('#errS6').hidden=false}
  b.disabled=false; b.textContent=t('s6.btn');
});
$('#btnEmo').addEventListener('click',()=>{track('emo_click',{lang});$('#emoText').dataset.t='emo.text';$('#emoText').textContent=t('emo.text');$('#btnEmoMore').hidden=false;show('emo')});
$('#btnEmoMore').addEventListener('click',()=>{$('#emoText').dataset.t='emo.more2';$('#emoText').textContent=t('emo.more2');$('#btnEmoMore').hidden=true;track('emo_still',{lang})});
$('#btnEmoOk').addEventListener('click',()=>{A.dresscode_ok='yes';A.note=(A.note?A.note+'; ':'')+'se declaró emo';track('emo_ok',{lang});show('s2')});
$('#btnChangeToYes').addEventListener('click',()=>{A.attending='yes';A.note='cambió de no a sí';track('rsvp_no_to_yes');show('s5')});
$$('[data-change]').forEach(b=>b.addEventListener('click',()=>{
  try{localStorage.removeItem('rsvp_done')}catch(e){}
  A.attending='';A.note='cambió su respuesta';hist=[];show('s1');
}));
$$('[data-track]').forEach(a=>a.addEventListener('click',()=>track(a.dataset.track,{lang})));

/* ---------- start ---------- */
(function(){
  const q=new URLSearchParams(location.search);
  const saved=read('lang'), ql=q.get('lang');
  const nav=(navigator.language||'es').slice(0,2).toLowerCase();
  const draft=read('rsvp_draft'); if(draft){try{const d=JSON.parse(draft);if(d.name)A.name=d.name}catch(e){}}
  const qn=(q.get('n')||q.get('i')||'').trim(); if(qn) A.name=qn;
  $('#iName').value=A.name;
  applyLang(T[ql]?ql:(saved&&T[saved]?saved:(nav==='ru'?'ru':nav==='en'?'en':'es')));
  if(read('rsvp_done')==='1'&&read('rsvp_name')){A.name=read('rsvp_name');show('again',false);return}
  show(A.name?'s1':'s0',false);
})();
